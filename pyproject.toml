[project]
name = "moneta"
version = "0.1.0"
description = "Settlement intelligence agent: reconciles Razorpay settlements against merchant books with explainable exception handling."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
moneta = "moneta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneta"]
